<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>For Andband 💖</title>

  <style>
    body {
      margin: 0;
      font-family: "Comic Sans MS", "Poppins", sans-serif;
      background: linear-gradient(135deg, #ffd6e8, #fff1f7);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #ff4d88;
    }

    .card {
      background: #ffffff;
      width: 90%;
      max-width: 360px;
      padding: 24px;
      border-radius: 24px;
      text-align: center;
      box-shadow: 0 10px 25px rgba(0,0,0,0.1);
    }

    h1 {
      font-size: 1.8rem;
      margin-bottom: 10px;
    }

    p {
      font-size: 1rem;
      line-height: 1.6;
      margin-bottom: 20px;
      color: #444;
    }

    .heart {
      font-size: 2rem;
      animation: bounce 1.5s infinite;
    }

    @keyframes bounce {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-8px); }
    }

    button {
      background: #ff4d88;
      color: white;
      border: none;
      padding: 12px 20px;
      border-radius: 30px;
      font-size: 1rem;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
    }

    button:hover {
      transform: scale(1.05);
      box-shadow: 0 5px 15px rgba(255,77,136,0.4);
    }

    .surprise {
      display: none;
      margin-top: 20px;
    }

    .surprise img {
      width: 100%;
      border-radius: 16px;
    }

    .footer {
      margin-top: 16px;
      font-size: 0.8rem;
      color: #aaa;
    }
  </style>
</head>

<body>
  <div class="card">
    <div class="heart">💗</div>

    <h1>Hey Andband!</h1>

    <p>
      Thank you for being there ❤️<br>
      For all the smiles, support, laughs,<br>
      and little moments that mean everything to me.
    </p>

    <button onclick="showSurprise()">Tap for a Surprise 🎁</button>

    <div class="surprise" id="surpriseBox">
      <p>You make my world brighter ✨</p>
      <!-- Put your photo in the same folder and name it photo.jpg -->
      <img src="photo.jpg" alt="Our Memory">
    </div>

    <div class="footer">Made with 💕 just for you</div>
  </div>

  <script>
    function showSurprise() {
      document.getElementById("surpriseBox").style.display = "block";
    }
  </script>
</body>
</html>
